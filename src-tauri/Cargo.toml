[package]
name = "bulk-scanner"
version = "1.0.2"
description = "Bulk Scanner — scan batches from network (AirScan/eSCL) scanners into named PDFs"
edition = "2021"

[lib]
name = "bulk_scanner_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-process = "2"
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["net", "time", "sync", "macros", "rt"] }
tokio-util = "0.7"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
if-addrs = "0.15"
regex = "1"
base64 = "0.22"
percent-encoding = "2"
socket2 = "0.6"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
