# Builds signed installers + updater files (latest.json) for Windows, macOS (one universal app for Apple Silicon + Intel) and Linux; tag v* to create a draft GitHub release
name: build
on:
  push: { tags: ['v*'] }
  workflow_dispatch:
permissions: { contents: write }
jobs:
  # One job creates the draft first so the parallel builds all upload into the same release (avoids duplicate drafts)
  release:
    runs-on: ubuntu-latest
    outputs: { id: '${{ steps.create.outputs.id }}' }
    steps:
      - id: create
        if: startsWith(github.ref, 'refs/tags/')
        env: { GH_TOKEN: '${{ secrets.GITHUB_TOKEN }}' }
        run: echo "id=$(gh api repos/${{ github.repository }}/releases -f tag_name='${{ github.ref_name }}' -f name='Bulk Scanner ${{ github.ref_name }}' -F draft=true --jq .id)" >> "$GITHUB_OUTPUT"
  build:
    needs: release
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, args: '' }
          - { os: macos-latest, args: '--target universal-apple-darwin' }
          - { os: ubuntu-22.04, args: '' }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: "${{ matrix.os == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}" }
      - uses: swatinem/rust-cache@v2
        with: { workspaces: src-tauri }
      # Ubuntu mirrors occasionally hang: cap each attempt at 5 minutes and retry
      - if: matrix.os == 'ubuntu-22.04'
        run: for i in 1 2 3; do sudo timeout 300 apt-get update && sudo timeout 300 apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf && exit 0; echo "apt attempt $i failed, retrying"; sleep 10; done; exit 1
      - run: npm ci
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          args: ${{ matrix.args }}
          releaseId: ${{ needs.release.outputs.id }}
          includeUpdaterJson: true
      - uses: actions/upload-artifact@v4
        with: { name: 'bulk-scanner-${{ matrix.os }}${{ matrix.args }}', path: 'src-tauri/target/**/release/bundle/**/*', if-no-files-found: ignore }
