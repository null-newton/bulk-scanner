# Builds signed installers + updater files (latest.json) for Windows, macOS (Apple Silicon + Intel) and Linux; tag v* to create a draft GitHub release
name: build
on:
  push: { tags: ['v*'] }
  workflow_dispatch:
permissions: { contents: write }
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, args: '' }
          - { os: macos-latest, args: '--target aarch64-apple-darwin' }
          - { os: macos-latest, args: '--target x86_64-apple-darwin' }
          - { os: ubuntu-22.04, args: '' }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: "${{ matrix.os == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}" }
      - uses: swatinem/rust-cache@v2
        with: { workspaces: src-tauri }
      - if: matrix.os == 'ubuntu-22.04'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - run: npm ci
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          args: ${{ matrix.args }}
          tagName: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
          releaseName: Bulk Scanner ${{ github.ref_name }}
          releaseDraft: true
          includeUpdaterJson: true
      - uses: actions/upload-artifact@v4
        with: { name: 'bulk-scanner-${{ matrix.os }}${{ matrix.args }}', path: 'src-tauri/target/**/release/bundle/**/*', if-no-files-found: ignore }
