# Fast sanity check on every push/PR: typecheck + build the UI, lint and test the Rust backend (Linux only)
name: check
on:
  push: { branches: [main] }
  pull_request:
concurrency: { group: 'check-${{ github.ref }}', cancel-in-progress: true }
jobs:
  check:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: dtolnay/rust-toolchain@stable
        with: { components: clippy }
      - uses: swatinem/rust-cache@v2
        with: { workspaces: src-tauri }
      - run: for i in 1 2 3; do sudo timeout 300 apt-get update && sudo timeout 300 apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf && exit 0; echo "apt attempt $i failed, retrying"; sleep 10; done; exit 1
      - run: npm ci
      - run: npm run build
      - run: cargo clippy --all-targets -- -D warnings
        working-directory: src-tauri
      - run: cargo test
        working-directory: src-tauri
